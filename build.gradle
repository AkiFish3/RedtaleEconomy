plugins {
	id 'fabric-loom' version '1.3.7'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 国内镜像优先，失败再走官方源
	maven {
		name = 'Aliyun'
		url 'https://maven.aliyun.com/repository/public'
	}
	// 添加 GeckoLib 仓库
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	mavenCentral()
}

dependencies {
	// 基础依赖
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// GeckoLib 依赖
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:4.2.3"

	// 软依赖编译期依赖（不打包）：FTB Quests / FTB Library，仅用于 R9 的 reward 类型
	// 运行时由 FTBQ 提供；未安装时本 mod 相关类通过 isModLoaded 守卫不会被加载
	// 仓库不含这两个 jar（版权），缺失时给出明确提示而不是一堆 import 报错
	['ftb-quests.jar', 'ftb-library.jar'].each { name ->
		if (file("libs/$name").exists()) {
			modCompileOnly files("libs/$name")
		} else {
			logger.warn("[redtale] 缺少 libs/$name —— FTBQ 集成相关源码将无法编译，获取方式见 libs/README.md")
		}
	}

	// 纯逻辑单测（不加载 Minecraft 运行时）
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed", "skipped" }
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		// 发布配置
	}
}