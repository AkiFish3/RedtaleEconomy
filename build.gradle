plugins {
	id 'fabric-loom' version '1.3.7'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// 国内镜像优先，失败再走官方源
	maven {
		name = 'Aliyun'
		url 'https://maven.aliyun.com/repository/public'
	}
	// 添加 GeckoLib 仓库
	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	mavenCentral()
}

dependencies {
	// 基础依赖
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// GeckoLib 依赖（T41）：优先用 libs/ 本地 jar 4.7.1.2（与赤物语客户端/服务端实装版本一致，
	// 可用 `--offline` 构建）；jar 不在时回落到 maven 坐标，保证换机器/CI 也能编。
	// 本地 jar 是 intermediary 映射的生产包，loom 会自动 remap 到 dev 命名空间。
	def geckolibJar = file("libs/geckolib-fabric-1.20.1-${project.geckolib_version}.jar")
	if (geckolibJar.exists()) {
		logger.lifecycle("[redtale] geckolib: local ${geckolibJar.name}")
		modImplementation files(geckolibJar)
	} else {
		logger.warn("[redtale] 缺少 libs/geckolib-fabric-1.20.1-${project.geckolib_version}.jar —— 回落 maven 坐标 ${project.geckolib_version}")
		modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:${project.geckolib_version}"
	}

	// 软依赖编译期依赖（不打包）：FTB Quests / FTB Library，仅用于 R9 的 reward 类型
	// 运行时由 FTBQ 提供；未安装时本 mod 相关类通过 isModLoaded 守卫不会被加载
	// 仓库不含这两个 jar（版权），缺失时给出明确提示而不是一堆 import 报错
	['ftb-quests.jar', 'ftb-library.jar', 'architectury.jar', 'contact.jar', 'sdm_economy.jar'].each { name ->
		if (file("libs/$name").exists()) {
			modCompileOnly files("libs/$name")
		} else {
			logger.warn("[redtale] 缺少 libs/$name —— FTBQ 集成相关源码将无法编译，获取方式见 libs/README.md")
		}
	}

	// 开发环境运行时模组（不进发布包）：让 runClient 与正式客户端渲染路径一致
	// 只需把 jar 丢进 libs/dev/，不需要写坐标；缺目录时静默跳过
	// ★警告★：只能放「不依赖 mixin 硬编码 intermediary 名」的模组。sodium / iris / sodium-extra
	// 把 `method_XXXX` 直接写进 @Inject，且不带 refmap，remap 无法改写注解字符串 ⇒ 在任何
	// yarn 命名的 dev 环境必崩（BufferBuilder / Identifier 处 MixinApplyError，2026-10-21 实测
	// modRuntimeOnly / modLocalRuntime / modImplementation 三种配置全部崩）。
	// 它们已移到 libs/dev/_disabled/，只在正式客户端用，dev 截图不需要。
	def devDir = file('libs/dev')
	if (devDir.isDirectory()) {
		devDir.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }.each { f ->
			logger.lifecycle("[redtale] dev runtime mod: ${f.name}")
			modRuntimeOnly files(f)
		}
	}

	// 纯逻辑单测（不加载 Minecraft 运行时）
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed", "skipped" }
	// 集成测试开关透传：./gradlew test -Dredtale.it.mysql=1 -Dredtale.it.mysql.port=3307
	["redtale.it.mysql", "redtale.it.mysql.host", "redtale.it.mysql.port",
	 "redtale.it.mysql.database", "redtale.it.mysql.user", "redtale.it.mysql.password",
	 "redtale.it.mysql.driverJar"].each { k ->
		if (System.getProperty(k) != null) systemProperty k, System.getProperty(k)
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		// 发布配置
	}
}

// B01：编译期开 lint，warning 一律修掉（构建日志里出现「警告」即为回归）
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}
